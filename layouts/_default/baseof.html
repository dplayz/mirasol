<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}" dir="{{ or site.Language.LanguageDirection `ltr` }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{- block "header" .}}
  <header class="sticky-top" id="pageheader">
    {{ partial "header.html" . }}
  </header>
  {{- end}}
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  {{- block "footer" .}}
    {{ partial "footer.html" . }}
  {{- end}}
</body>
</html>
