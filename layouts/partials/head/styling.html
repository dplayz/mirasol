
{{ $currentStyle := "" }}
{{ if .Params.pageStyle }}
  {{ range $.Site.Params.styles.config }}
    {{ if eq .name $.Params.pageStyle }}
      {{ $currentStyle = .stylesheet }}
    {{ end }}
  {{ end }}
{{ end }}

{{ if not $currentStyle }}
  {{ $currentStyle = $.Site.Params.styles.default }}
{{ end }}

<script>
  (function () {
    window.getPreferredBootstrapTheme = function () {
      const storedTheme = localStorage.getItem('theme');
      if (storedTheme) {
        return storedTheme;
      }
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    };

    window.setBootstrapTheme = function (theme) {
      if (theme === 'auto') {
        localStorage.removeItem('theme');
        const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-bs-theme', systemTheme);
      } else {
        localStorage.setItem('theme', theme);
        document.documentElement.setAttribute('data-bs-theme', theme);
      }
      updateToggleUI();
    };

    window.toggleBootstrapTheme = function () {
      const currentTheme = window.getPreferredBootstrapTheme();
      const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
      window.setBootstrapTheme(nextTheme);
    };

    const updateToggleUI = () => {
      const currentTheme = window.getPreferredBootstrapTheme();
      const isDark = currentTheme === 'dark';

      document.querySelectorAll('[data-theme-toggle]').forEach((btn) => {
        btn.setAttribute('aria-label', `Switch to ${isDark ? 'light' : 'dark'} mode`);
      });

      document.querySelectorAll('[data-theme-label]').forEach((label) => {
        label.textContent = isDark ? 'Light Mode' : 'Dark Mode';
      });
    };

    const initialTheme = localStorage.getItem('theme');
    if (initialTheme) {
      document.documentElement.setAttribute('data-bs-theme', initialTheme);
    } else {
      const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-bs-theme', systemTheme);
    }

    document.addEventListener('turbo:load', () => {
      const activeTheme = window.getPreferredBootstrapTheme();
      document.documentElement.setAttribute('data-bs-theme', activeTheme);
      updateToggleUI();
    });

    document.addEventListener('turbo:before-cache', () => {
      const activeTheme = window.getPreferredBootstrapTheme();
      document.documentElement.setAttribute('data-bs-theme', activeTheme);
    });

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (!localStorage.getItem('theme')) {
        window.setBootstrapTheme('auto');
      }
    });
  })();
</script>



<link 
  id="site-style" 
  rel="stylesheet" 
  href="{{ $currentStyle }}"
  data-turbo-track="reload"
>
<script data-turbo-permanent>
  var styleMap = {
    {{- range .Site.Params.styles.config }}
      '{{ .name }}': {{ printf "'%s'" .stylesheet | safeJS }},
    {{- end }}
  };

  function changeStyle(name) {
    var targetLink = document.getElementById('site-style');
    if (targetLink && styleMap[name]) {
      targetLink.setAttribute('href', styleMap[name]);
    }
  }
</script>


<script>
(function() {
  window.applyAndSaveStyle = function(styleName) {
    if (styleName === "default"){
      localStorage.removeItem('pageStyle');
      const url = new URL(window.location.href);
      url.searchParams.delete('pageStyle');
      window.history.replaceState({}, '', url.toString());
      changeStyle(document.body.dataset.defaultStyle);
      syncTogglerUI(document.body.dataset.defaultStyle);
      return;
    }
    if (!styleMap[styleName]) return;

    localStorage.setItem('pageStyle', styleName);

    const url = new URL(window.location.href);
    url.searchParams.set('pageStyle', styleName);
    window.history.replaceState({}, '', url.toString());

    changeStyle(styleName);

  };


  function resolveAndApplyStyle() {
    const body = document.body;

    const urlParams = new URLSearchParams(window.location.search);
    const pageStyleUrlParam = urlParams.get('pageStyle');

    const hash = window.location.hash.replace('#', '');
    const pageStyleData = body ? body.dataset.pageStyle : null;
    const userPreferenceStyle = localStorage.getItem('pageStyle');
    const defaultStyleData = body ? body.dataset.defaultStyle : null;

    const styleToApply = 
      (styleMap[pageStyleUrlParam] ? pageStyleUrlParam : null) || 
      (styleMap[hash] ? hash : null) || 
      (styleMap[userPreferenceStyle] ? userPreferenceStyle : null) || 
      (styleMap[pageStyleData] ? pageStyleData : null) || 
      defaultStyleData;

    if (styleToApply) {
      changeStyle(styleToApply);
      syncTogglerUI(styleToApply);
    }
  }

  document.addEventListener('turbo:before-render', resolveAndApplyStyle);
  document.addEventListener('turbo:load', resolveAndApplyStyle);
  window.addEventListener('hashchange', resolveAndApplyStyle);
  window.addEventListener('popstate', resolveAndApplyStyle);

  resolveAndApplyStyle();

})();
</script>
