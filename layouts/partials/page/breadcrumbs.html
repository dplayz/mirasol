{{- if and (ne .Params.single true) (ne .Params.hideBreadcrumbs true) }}
<nav aria-label="breadcrumb">
  <ol class="breadcrumb breadcrumb-chevron p-2 my-0 bg-body-tertiary rounded-3">
      <li class="breadcrumb-item">
          <a class="link-body-emphasis" href="{{.Site.BaseURL}}">
              <i class="bi bi-house-fill"></i><span class="visually-hidden">Home</span>
          </a>
      </li>
    {{- range .Ancestors.Reverse }}
      {{- if not .IsHome }}
      <li class="breadcrumb-item">
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      </li>
      {{- end }}
    {{- end }}
      <li class="breadcrumb-item active" aria-current="page">
        {{ .Title }}
      </li>

  </ol>
</nav>
{{- end}}
